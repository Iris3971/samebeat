name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r server/requirements.txt -r requirements-dev.txt -c requirements-lock.txt
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s agent -p 'test_*.py'
      - run: python -m unittest discover -s server -p 'test_*.py'
